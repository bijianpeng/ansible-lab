---
# Kafka（依赖 jdk role，复用已部署的 zookeeper）
kafka_version: "3.7.0"
kafka_package_file: "kafka_2.13-{{ kafka_version }}.tgz"
kafka_download_url: "https://repo.huaweicloud.com/apache/kafka/{{ kafka_version }}/{{ kafka_package_file }}"

kafka_user: "kafka"
kafka_base_dir: "{{ apps_base_dir }}/kafka"
kafka_data_dir: "{{ data_base_dir }}/kafka-logs"
kafka_port: 9092

kafka_heap_opts: "-Xmx2G -Xms2G"
kafka_replication_factor: 3
kafka_partitions: 8

# KRaft 模式（true 时不依赖 zookeeper，自动生成 cluster id）
kafka_kraft: false
kafka_zookeeper_connect: "{{ groups['zookeeper-servers'] | map('regex_replace', '^(.*)$', '\\1:2181') | join(',') }}"
kafka_kraft_controller_port: 9093
