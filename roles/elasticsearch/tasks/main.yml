---
- name: Create es user
  ansible.builtin.user:
    name: "{{ elasticsearch_user }}"
    shell: /sbin/nologin
    create_home: false

- name: Ensure vm.max_map_count
  ansible.builtin.shell: sysctl -w vm.max_map_count=262144 && grep -q '^vm.max_map_count' /etc/sysctl.conf || echo "vm.max_map_count = 262144" >> /etc/sysctl.conf
  changed_when: false
  failed_when: false

- name: Fetch elasticsearch package
  include_role:
    name: fetch_package
  vars:
    fp_url: "{{ elasticsearch_download_url }}"
    fp_file: "{{ elasticsearch_package_file }}"

- name: Unarchive elasticsearch
  ansible.builtin.unarchive:
    src: "{{ fp_dest }}"
    dest: "{{ apps_base_dir }}"
    remote_src: true
    creates: "{{ apps_base_dir }}/elasticsearch-{{ elasticsearch_version }}"

- name: Create symlink
  ansible.builtin.file:
    src: "{{ apps_base_dir }}/elasticsearch-{{ elasticsearch_version }}"
    dest: "{{ elasticsearch_base_dir }}"
    state: link

- name: Create data/log directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_user }}"
    mode: '0755'
  loop:
    - "{{ elasticsearch_data_dir }}"
    - "{{ elasticsearch_base_dir }}/logs"

- name: Install elasticsearch.yml
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: "{{ elasticsearch_base_dir }}/config/elasticsearch.yml"
    mode: '0644'
    owner: "{{ elasticsearch_user }}"
  notify: restart elasticsearch

- name: Tune jvm.options heap
  ansible.builtin.lineinfile:
    path: "{{ elasticsearch_base_dir }}/config/jvm.options.d/heap.options"
    create: true
    line: "{{ item }}"
    mode: '0644'
    owner: "{{ elasticsearch_user }}"
  loop:
    - "-Xms{{ elasticsearch_heap_size }}"
    - "-Xmx{{ elasticsearch_heap_size }}"
  notify: restart elasticsearch

- name: Install systemd unit
  ansible.builtin.template:
    src: elasticsearch.service.j2
    dest: /etc/systemd/system/elasticsearch.service
    mode: '0644'

- name: Fix ownership
  ansible.builtin.file:
    path: "{{ apps_base_dir }}/elasticsearch-{{ elasticsearch_version }}"
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_user }}"
    recurse: true

- name: Start elasticsearch
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: true
    daemon_reload: true
