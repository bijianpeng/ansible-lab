---
- name: Create kibana user
  ansible.builtin.user:
    name: "{{ kibana_user }}"
    shell: /sbin/nologin
    create_home: false

- name: Fetch kibana package
  include_role:
    name: fetch_package
  vars:
    fp_url: "{{ kibana_download_url }}"
    fp_file: "{{ kibana_package_file }}"

- name: Unarchive kibana
  ansible.builtin.unarchive:
    src: "{{ fp_dest }}"
    dest: "{{ apps_base_dir }}"
    remote_src: true
    creates: "{{ apps_base_dir }}/kibana-{{ kibana_version }}"

- name: Create symlink
  ansible.builtin.file:
    src: "{{ apps_base_dir }}/kibana-{{ kibana_version }}"
    dest: "{{ kibana_base_dir }}"
    state: link

- name: Install kibana.yml
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: "{{ kibana_base_dir }}/config/kibana.yml"
    mode: '0644'
    owner: "{{ kibana_user }}"
  notify: restart kibana

- name: Install systemd unit
  ansible.builtin.template:
    src: kibana.service.j2
    dest: /etc/systemd/system/kibana.service
    mode: '0644'

- name: Fix ownership
  ansible.builtin.file:
    path: "{{ apps_base_dir }}/kibana-{{ kibana_version }}"
    owner: "{{ kibana_user }}"
    group: "{{ kibana_user }}"
    recurse: true

- name: Start kibana
  ansible.builtin.systemd:
    name: kibana
    state: started
    enabled: true
    daemon_reload: true
