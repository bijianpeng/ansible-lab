---
# MySQL 8.0 通用二进制（glibc2.28 tar.xz，跨 麒麟V10/CentOS8/Ubuntu）
mysql_version: "8.0.36"
mysql_arch: "{{ 'x86_64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
mysql_package_file: "mysql-{{ mysql_version }}-linux-glibc2.28-{{ mysql_arch }}.tar.xz"
mysql_download_url: "https://cdn.mysql.com/Downloads/MySQL-8.0/{{ mysql_package_file }}"
mysql_src_dir: "mysql-{{ mysql_version }}-linux-glibc2.28-{{ mysql_arch }}"

mysql_user: "mysql"
mysql_base_dir: "{{ apps_base_dir }}/mysql"
mysql_data_dir: "{{ data_base_dir }}/mysql"
mysql_port: 3306
mysql_root_password: "ChangeMe_123"
mysql_max_connections: 2000
mysql_innodb_buffer_size: "4G"     # 按机器内存调整，建议 50%~70%

# 主从复制
mysql_replication: true
mysql_repl_user: "repl"
mysql_repl_password: "Repl_123"
