---
- name: Create prometheus user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    shell: /sbin/nologin
    create_home: false

- name: Fetch prometheus package
  include_role:
    name: fetch_package
  vars:
    fp_url: "{{ prometheus_download_url }}"
    fp_file: "{{ prometheus_package_file }}"

- name: Unarchive prometheus
  ansible.builtin.unarchive:
    src: "{{ fp_dest }}"
    dest: "{{ apps_base_dir }}"
    remote_src: true
    creates: "{{ apps_base_dir }}/prometheus-{{ prometheus_version }}.linux-{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"

- name: Create symlink
  ansible.builtin.file:
    src: "{{ apps_base_dir }}/prometheus-{{ prometheus_version }}.linux-{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    dest: "{{ prometheus_base_dir }}"
    state: link

- name: Create data directory
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: '0755'

- name: Install prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_base_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    mode: '0644'
  notify: restart prometheus

- name: Install systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: '0644'

- name: Start prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true
