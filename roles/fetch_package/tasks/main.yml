---
# 公共下载缓存机制
# 用法（在其他 role 中）：
#   - include_role:
#       name: fetch_package
#     vars:
#       fp_url: "{{ kafka_download_url }}"
#       fp_file: "{{ kafka_package_file }}"
# 行为：
#   1. 检查控制端 local_cache_dir/{{ fp_file }} 是否存在
#   2. 不存在则从 fp_url 下载到控制端缓存目录
#   3. copy 到目标机 {{ remote_pkg_dir }}/{{ fp_file }}
# 结果输出：fp_dest = "{{ remote_pkg_dir }}/{{ fp_file }}"

- name: Ensure local cache directory exists
  ansible.builtin.file:
    path: "{{ local_cache_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Check local cache
  ansible.builtin.stat:
    path: "{{ local_cache_dir }}/{{ fp_file }}"
  delegate_to: localhost
  become: false
  register: fp_cache_stat

- name: Download package to local cache
  ansible.builtin.get_url:
    url: "{{ fp_url }}"
    dest: "{{ local_cache_dir }}/{{ fp_file }}"
    mode: '0644'
    timeout: "{{ download_timeout }}"
  delegate_to: localhost
  become: false
  when: not fp_cache_stat.stat.exists

- name: Ensure remote package directory exists
  ansible.builtin.file:
    path: "{{ remote_pkg_dir }}"
    state: directory
    mode: '0755'

- name: Copy package to remote
  ansible.builtin.copy:
    src: "{{ local_cache_dir }}/{{ fp_file }}"
    dest: "{{ remote_pkg_dir }}/{{ fp_file }}"
    mode: '0644'

- name: Set package destination fact
  ansible.builtin.set_fact:
    fp_dest: "{{ remote_pkg_dir }}/{{ fp_file }}"
